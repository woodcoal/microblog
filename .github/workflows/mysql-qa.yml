name: MySQL QA

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/mysql-qa.yml'
            - 'prisma/**'
            - 'scripts/run-*-test.mjs'
            - 'scripts/run-mysql-qa.mjs'
            - 'src/lib/database-adapter.ts'
            - 'src/services/admin.service.ts'
            - 'src/services/content.service.ts'
            - 'src/services/media*.ts'
            - 'src/lib/upload.ts'
            - 'tests/admin-audit.service.test.ts'
            - 'tests/blog-assets.service.test.ts'
            - 'package.json'

permissions:
    contents: read

jobs:
    mysql-qa:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: mutan_qa
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_ROOT_HOST: '%'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd='mysqladmin ping -h 127.0.0.1 -uroot --silent'
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=30
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile
            - name: Run isolated MySQL QA
              env:
                  DATABASE_PROVIDER: mysql
                  TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/mutan_qa
                  MYSQL_QA_ALLOW_RESET: 'true'
              run: pnpm run test:mysql-qa
