<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 管理后台</title>
		<style>
			:root {
				--bg: #fff;
				--surface: #f8fafc;
				--raised: #fff;
				--text: #1a1a2e;
				--muted: #64748b;
				--border: #e2e8f0;
				--primary: #4f46e5;
				--primary-soft: #eef2ff;
				--radius: 10px;
				--radius-sm: 6px;
				font:
					15px -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					'Noto Sans SC',
					'Microsoft YaHei',
					sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: var(--text);
				background: var(--bg);
			}
			button,
			input {
				font: inherit;
			}
			.admin-shell {
				display: grid;
				grid-template-columns: 248px minmax(0, 1fr);
				min-height: 100vh;
			}
			.admin-rail {
				position: sticky;
				top: 0;
				height: 100vh;
				padding: 22px 16px;
				background: var(--surface);
				border-right: 1px solid var(--border);
			}
			.brand {
				display: block;
				margin: 0 8px 30px;
				color: var(--text);
				text-decoration: none;
				font-size: 20px;
				font-weight: 800;
			}
			.brand i {
				color: var(--primary);
				font-style: normal;
			}
			.admin-rail h2 {
				margin: 20px 8px 7px;
				color: var(--muted);
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			.admin-rail a:not(.brand) {
				display: block;
				padding: 9px 10px;
				color: var(--text);
				border-radius: var(--radius-sm);
				text-decoration: none;
				font-size: 14px;
			}
			.admin-rail a.active {
				color: var(--primary);
				background: var(--primary-soft);
				font-weight: 700;
			}
			.admin-main {
				min-width: 0;
			}
			.admin-top {
				height: 64px;
				padding: 0 32px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				background: var(--raised);
				border-bottom: 1px solid var(--border);
			}
			.admin-top strong {
				font-size: 14px;
			}
			.top-actions {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.icon {
				width: 36px;
				height: 36px;
				display: grid;
				place-items: center;
				color: var(--muted);
			}
			.account {
				display: flex;
				align-items: center;
				gap: 7px;
				padding: 4px 9px 4px 4px;
				border: 1px solid var(--border);
				border-radius: 99px;
				background: var(--raised);
			}
			.avatar {
				width: 28px;
				height: 28px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--primary);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.admin-body {
				max-width: 1180px;
				margin: auto;
				padding: 32px;
			}
			.heading {
				display: flex;
				align-items: end;
				justify-content: space-between;
				margin-bottom: 24px;
			}
			.heading h1 {
				margin: 0;
				font-size: 27px;
				letter-spacing: -0.04em;
			}
			.heading p {
				margin: 4px 0 0;
				color: var(--muted);
			}
			.button {
				padding: 10px 14px;
				border: 0;
				border-radius: var(--radius-sm);
				background: var(--primary);
				color: #fff;
				font-weight: 700;
			}
			.panel {
				overflow: hidden;
				background: var(--raised);
				border: 1px solid var(--border);
				border-radius: var(--radius);
			}
			.tools {
				display: flex;
				gap: 10px;
				padding: 14px;
				border-bottom: 1px solid var(--border);
			}
			.tools input {
				flex: 1;
				max-width: 290px;
				padding: 9px 10px;
				color: var(--text);
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: var(--radius-sm);
			}
			.filter {
				padding: 8px 10px;
				color: var(--text);
				background: var(--raised);
				border: 1px solid var(--border);
				border-radius: var(--radius-sm);
			}
			.row {
				display: grid;
				grid-template-columns: 1.6fr 0.9fr 0.8fr 0.6fr;
				gap: 16px;
				align-items: center;
				padding: 14px 16px;
				border-bottom: 1px solid var(--border);
				font-size: 14px;
			}
			.row:last-child {
				border: 0;
			}
			.row.header {
				padding-block: 10px;
				color: var(--muted);
				background: var(--surface);
				font-size: 12px;
				font-weight: 700;
			}
			.meta {
				color: var(--muted);
				font-size: 12px;
			}
			.status {
				display: inline-block;
				padding: 3px 8px;
				color: var(--primary);
				background: var(--primary-soft);
				border-radius: 99px;
				font-size: 12px;
				font-weight: 700;
			}
			.mobile {
				display: none;
			}
			@media (max-width: 767px) {
				.admin-shell {
					display: block;
				}
				.admin-rail {
					display: none;
				}
				.admin-top {
					padding: 0 14px;
				}
				.admin-body {
					padding: 20px 14px 80px;
				}
				.heading h1 {
					font-size: 24px;
				}
				.tools {
					flex-wrap: wrap;
				}
				.tools input {
					min-width: 100%;
				}
				.row {
					grid-template-columns: minmax(0, 1fr) auto;
					gap: 8px;
				}
				.row > :nth-child(2),
				.row > :nth-child(4) {
					display: none;
				}
				.row.header > :nth-child(2),
				.row.header > :nth-child(4) {
					display: none;
				}
				.mobile {
					position: fixed;
					z-index: 3;
					bottom: 0;
					left: 0;
					right: 0;
					display: flex;
					justify-content: space-around;
					padding: 7px;
					background: var(--raised);
					border-top: 1px solid var(--border);
				}
				.mobile a {
					padding: 10px;
					color: var(--muted);
					font-size: 12px;
				}
				.mobile a.active {
					color: var(--primary);
					font-weight: 700;
				}
			}
		</style>
	</head>
	<body>
		<main class="admin-shell">
			<nav class="admin-rail">
				<a class="brand">睦<i>谈</i> 管理</a>
				<h2>概览</h2>
				<a>仪表盘</a>
				<h2>内容治理</h2>
				<a class="active">帖子管理</a><a>评论管理</a><a>标签与分类</a>
				<h2>用户</h2>
				<a>用户管理</a><a>举报与审核</a>
			</nav>
			<section class="admin-main">
				<header class="admin-top">
					<strong>内容治理 / 帖子管理</strong>
					<div class="top-actions">
						<span class="icon">♢</span
						><span class="account"><span class="avatar">木</span>木炭</span>
					</div>
				</header>
				<div class="admin-body">
					<div class="heading">
						<div>
							<h1>帖子管理</h1>
							<p>筛选、审阅与处理社区内容。</p>
						</div>
						<button class="button">导出列表</button>
					</div>
					<section class="panel">
						<div class="tools">
							<input placeholder="按标题、作者或 ID 搜索" /><button class="filter">
								状态：全部</button
							><button class="filter">频道：全部</button>
						</div>
						<div class="row header">
							<div>帖子</div>
							<div>频道</div>
							<div>状态</div>
							<div>更新时间</div>
						</div>
						<div class="row">
							<div>
								<strong>如何让小社区的讨论持续发生？</strong><br /><span
									class="meta"
									>@linchong · 1,248 浏览</span
								>
							</div>
							<div>论坛</div>
							<div><span class="status">已发布</span></div>
							<div>12 分钟前</div>
						</div>
						<div class="row">
							<div>
								<strong>关于本周新功能的三点观察</strong><br /><span class="meta"
									>@huarong · 684 浏览</span
								>
							</div>
							<div>微博</div>
							<div><span class="status">已发布</span></div>
							<div>38 分钟前</div>
						</div>
						<div class="row">
							<div>
								<strong>从信息流到知识沉淀的设计取舍</strong><br /><span
									class="meta"
									>@wutong · 391 浏览</span
								>
							</div>
							<div>博客</div>
							<div><span class="status">待审核</span></div>
							<div>昨天</div>
						</div>
					</section>
				</div>
			</section>
		</main>
		<nav class="mobile"><a>概览</a><a class="active">内容</a><a>审核</a><a>我的</a></nav>
	</body>
</html>
