<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 写博客</title>
		<style>
			:root {
				--bg: #fff;
				--surface: #f8fafc;
				--card: #fff;
				--text: #1a1a2e;
				--muted: #64748b;
				--line: #e2e8f0;
				--primary: #4f46e5;
				--soft: #eef2ff;
				--font:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
					'Microsoft YaHei', sans-serif;
			}
			[data-theme='dark'] {
				--bg: #0f172a;
				--surface: #172033;
				--card: #1e293b;
				--text: #e2e8f0;
				--muted: #94a3b8;
				--line: #334155;
				--primary: #818cf8;
				--soft: #252b52;
			}
			[data-theme='eye'] {
				--bg: #f5f0e8;
				--surface: #ede8dc;
				--card: #faf7f0;
				--text: #3d3929;
				--muted: #8a8474;
				--line: #d4cfc4;
				--primary: #6b8e4e;
				--soft: #e2ead8;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.6 var(--font);
			}
			button,
			input,
			select,
			textarea {
				font: inherit;
			}
			button,
			a,
			select,
			input,
			textarea {
				outline-offset: 2px;
			}
			button:focus-visible,
			a:focus-visible,
			select:focus-visible,
			input:focus-visible,
			textarea:focus-visible {
				outline: 3px solid var(--primary);
			}
			a {
				text-decoration: none;
				color: inherit;
			}
			.top {
				height: 64px;
				display: flex;
				align-items: center;
				gap: 18px;
				padding: 0 24px;
				border-bottom: 1px solid var(--line);
				background: var(--card);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
				letter-spacing: -0.05em;
			}
			.brand i {
				color: var(--primary);
				font-style: normal;
			}
			.draft {
				color: var(--muted);
				font-size: 13px;
			}
			.actions {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.save,
			.theme,
			.avatar,
			.publish {
				min-height: 36px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--card);
				color: var(--text);
				padding: 0 10px;
			}
			.save {
				color: var(--muted);
			}
			.theme {
				padding: 0 7px;
			}
			.publish {
				border-color: var(--primary);
				background: var(--primary);
				color: #fff;
				font-weight: 750;
			}
			.avatar {
				width: 34px;
				padding: 0;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--primary);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.editor {
				width: min(100%, 1140px);
				margin: auto;
				padding: 40px 24px 90px;
				display: grid;
				grid-template-columns: minmax(0, 760px) 230px;
				gap: 56px;
			}
			.work {
				min-width: 0;
			}
			.meta {
				display: flex;
				gap: 8px;
				align-items: center;
				color: var(--muted);
				font-size: 13px;
			}
			.meta select {
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 6px 8px;
				background: var(--card);
				color: var(--text);
			}
			.title {
				width: 100%;
				margin: 24px 0 10px;
				border: 0;
				border-bottom: 1px solid transparent;
				background: transparent;
				color: var(--text);
				font-size: clamp(30px, 4vw, 46px);
				font-weight: 800;
				line-height: 1.16;
				letter-spacing: -0.055em;
			}
			.title:focus {
				border-bottom-color: var(--line);
				outline: 0;
			}
			.summary {
				width: 100%;
				min-height: 52px;
				border: 0;
				background: transparent;
				color: var(--muted);
				font-size: 17px;
				resize: none;
			}
			.toolbar {
				display: flex;
				gap: 2px;
				align-items: center;
				margin: 18px 0 12px;
				padding: 6px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--surface);
			}
			.toolbar button {
				width: 34px;
				height: 32px;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--text);
				font-weight: 750;
			}
			.toolbar button:hover {
				background: var(--soft);
				color: var(--primary);
			}
			.body {
				min-height: 380px;
				padding: 12px 0;
				border: 0;
				border-top: 1px solid var(--line);
				background: transparent;
				color: var(--text);
				font:
					18px/1.85 Georgia,
					'Noto Serif SC',
					'Songti SC',
					serif;
				outline: 0;
			}
			.body:empty:before {
				content: attr(data-placeholder);
				color: var(--muted);
				pointer-events: none;
			}
			.side {
				padding-top: 10px;
			}
			.side h2 {
				margin: 0 0 10px;
				color: var(--muted);
				font-size: 12px;
				letter-spacing: 0.08em;
			}
			.side label {
				display: block;
				margin: 18px 0 6px;
				font-size: 13px;
				font-weight: 750;
			}
			.side input {
				width: 100%;
				min-height: 38px;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 0 9px;
				background: var(--card);
				color: var(--text);
			}
			.tags {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.tag {
				padding: 5px 8px;
				border: 1px solid var(--line);
				border-radius: 99px;
				color: var(--muted);
				font-size: 12px;
			}
			.tip {
				margin-top: 28px;
				padding-top: 18px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 13px;
			}
			.status {
				min-height: 18px;
				margin: 10px 0 0;
				color: var(--primary);
				font-size: 13px;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 14px;
					gap: 10px;
				}
				.draft {
					display: none;
				}
				.save {
					display: none;
				}
				.actions {
					gap: 6px;
				}
				.theme {
					width: 36px;
					padding: 0;
					font-size: 0;
				}
				.theme option {
					font-size: 14px;
				}
				.publish {
					padding: 0 10px;
				}
				.editor {
					display: block;
					padding: 26px 16px 50px;
				}
				.side {
					margin-top: 32px;
					padding-top: 22px;
					border-top: 1px solid var(--line);
				}
				.body {
					min-height: 300px;
					font-size: 17px;
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand" href="home-c.html">睦<i>谈</i></a
			><span class="draft">博客草稿</span>
			<div class="actions">
				<button class="save" id="save">保存草稿</button
				><select class="theme" id="theme" aria-label="切换主题">
					<option value="light">浅色</option>
					<option value="dark">深色</option>
					<option value="eye">护眼</option></select
				><button class="publish" id="publish">发布</button
				><button class="avatar" aria-label="账户菜单">木</button>
			</div>
		</header>
		<main class="editor">
			<article class="work">
				<div class="meta">
					<span>发布到</span
					><select aria-label="选择频道">
						<option>博客</option>
						<option>论坛专栏</option></select
					><span>· 仅自己可见</span>
				</div>
				<input
					class="title"
					aria-label="文章标题"
					placeholder="给文章起一个清晰的标题"
					value="从信息流到知识沉淀的设计取舍"
				/><textarea
					class="summary"
					aria-label="文章摘要"
					placeholder="一句摘要，帮助读者决定是否阅读。"
				>
社区既要有即时的交流，也需要让值得反复阅读的思考沉淀下来。</textarea>
				<nav class="toolbar" aria-label="编辑工具">
					<button data-command="bold" title="加粗">B</button
					><button data-command="italic" title="斜体"><i>I</i></button
					><button data-command="formatBlock" data-value="h2" title="二级标题">H2</button
					><button data-command="insertUnorderedList" title="无序列表">•</button
					><button id="quote" title="引用">“</button>
				</nav>
				<div
					class="body"
					id="body"
					contenteditable="true"
					data-placeholder="从这里开始写作…"
				>
					信息流擅长让一条想法很快抵达别人，但不擅长保留上下文。<br /><br />当讨论值得被反复阅读时，内容需要一个更安静的落点。
				</div>
				<p class="status" id="status" aria-live="polite"></p>
			</article>
			<aside class="side">
				<h2>发布设置</h2>
				<label for="tags">标签</label><input id="tags" value="产品设计, 社区" />
				<div class="tags">
					<span class="tag">产品设计</span><span class="tag">社区</span>
				</div>
				<label for="cover">封面图</label
				><input id="cover" placeholder="粘贴图片链接（可选）" />
				<p class="tip">草稿会保存在本地；发布前可继续调整频道、标签与可见范围。</p>
			</aside>
		</main>
		<script>
			const root = document.documentElement,
				theme = document.querySelector('#theme'),
				status = document.querySelector('#status');
			theme.value = localStorage.getItem('mutan-theme') || 'light';
			root.dataset.theme = theme.value;
			theme.onchange = () => {
				root.dataset.theme = theme.value;
				localStorage.setItem('mutan-theme', theme.value);
			};
			document.querySelectorAll('[data-command]').forEach(
				(b) =>
					(b.onclick = () => {
						document.execCommand(b.dataset.command, false, b.dataset.value || null);
						document.querySelector('#body').focus();
					})
			);
			document.querySelector('#quote').onclick = () => {
				document.execCommand('formatBlock', false, 'blockquote');
				document.querySelector('#body').focus();
			};
			document.querySelector('#save').onclick = () =>
				(status.textContent = '草稿已保存到本地 · 刚刚');
			document.querySelector('#publish').onclick = () =>
				(status.textContent = '这是交互原型：文章已通过发布前检查。');
		</script>
	</body>
</html>
