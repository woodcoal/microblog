<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 关注与粉丝</title>
		<style>
			:root {
				--bg: #fff;
				--surface: #f8fafc;
				--card: #fff;
				--text: #1a1a2e;
				--muted: #64748b;
				--line: #e2e8f0;
				--primary: #4f46e5;
				--soft: #eef2ff;
				--font:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
					'Microsoft YaHei', sans-serif;
			}
			[data-theme='dark'] {
				--bg: #0f172a;
				--surface: #172033;
				--card: #1e293b;
				--text: #e2e8f0;
				--muted: #94a3b8;
				--line: #334155;
				--primary: #818cf8;
				--soft: #252b52;
			}
			[data-theme='eye'] {
				--bg: #f5f0e8;
				--surface: #ede8dc;
				--card: #faf7f0;
				--text: #3d3929;
				--muted: #8a8474;
				--line: #d4cfc4;
				--primary: #6b8e4e;
				--soft: #e2ead8;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.55 var(--font);
			}
			a {
				text-decoration: none;
				color: inherit;
			}
			button,
			select {
				font: inherit;
			}
			button:focus-visible,
			a:focus-visible,
			select:focus-visible {
				outline: 3px solid var(--primary);
				outline-offset: 2px;
			}
			.top {
				height: 64px;
				display: flex;
				align-items: center;
				gap: 26px;
				padding: 0 24px;
				border-bottom: 1px solid var(--line);
				background: var(--card);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
				letter-spacing: -0.05em;
			}
			.brand i {
				color: var(--primary);
				font-style: normal;
			}
			.links {
				display: flex;
				gap: 5px;
				flex: 1;
			}
			.links a {
				padding: 8px 10px;
				color: var(--muted);
			}
			.actions {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.search,
			.theme {
				height: 36px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--card);
				color: var(--text);
				padding: 0 9px;
			}
			.search {
				width: 180px;
				color: var(--muted);
			}
			.avatar {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--primary);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.shell {
				width: min(100%, 1040px);
				margin: auto;
				padding: 34px 24px 80px;
				display: grid;
				grid-template-columns: 190px minmax(0, 660px);
				gap: 46px;
				justify-content: center;
			}
			.person {
				padding-top: 4px;
			}
			.profile {
				display: flex;
				gap: 10px;
				align-items: center;
				margin-bottom: 22px;
			}
			.big-avatar {
				width: 42px;
				height: 42px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--soft);
				color: var(--primary);
				font-weight: 800;
			}
			.person b {
				display: block;
			}
			.person span {
				color: var(--muted);
				font-size: 13px;
			}
			.side a {
				display: block;
				padding: 9px 10px;
				border-radius: 6px;
				color: var(--muted);
			}
			.side a.on {
				background: var(--soft);
				color: var(--primary);
				font-weight: 750;
			}
			.content h1 {
				margin: 0;
				font-size: 28px;
				letter-spacing: -0.045em;
			}
			.content > p {
				margin: 4px 0 20px;
				color: var(--muted);
			}
			.tabs {
				display: flex;
				gap: 16px;
				border-bottom: 1px solid var(--line);
			}
			.tabs button {
				padding: 10px 3px;
				border: 0;
				border-bottom: 2px solid transparent;
				background: transparent;
				color: var(--muted);
				font-weight: 700;
			}
			.tabs button.on {
				border-color: var(--primary);
				color: var(--primary);
			}
			.list {
				margin-top: 2px;
			}
			.member {
				display: grid;
				grid-template-columns: 42px minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
				padding: 17px 0;
				border-bottom: 1px solid var(--line);
			}
			.member .photo {
				width: 42px;
				height: 42px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--soft);
				color: var(--primary);
				font-size: 13px;
				font-weight: 800;
			}
			.member h2 {
				margin: 0;
				font-size: 16px;
			}
			.member p {
				margin: 2px 0 0;
				color: var(--muted);
				font-size: 13px;
			}
			.follow {
				min-height: 34px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--card);
				color: var(--text);
				padding: 0 11px;
				font-size: 13px;
				font-weight: 700;
			}
			.follow.active {
				border-color: var(--primary);
				background: var(--primary);
				color: #fff;
			}
			.hint {
				margin: 22px 0;
				color: var(--muted);
				font-size: 13px;
				text-align: center;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 14px;
					gap: 10px;
				}
				.links {
					display: none;
				}
				.search {
					width: 36px;
					padding: 0;
					font-size: 0;
					border: 0;
				}
				.search:after {
					content: '⌕';
					font-size: 24px;
				}
				.theme {
					width: 36px;
					padding: 0;
					font-size: 0;
				}
				.shell {
					display: block;
					padding: 22px 14px 70px;
				}
				.person {
					display: flex;
					gap: 12px;
					align-items: center;
					margin-bottom: 18px;
				}
				.profile {
					margin: 0;
				}
				.side {
					display: flex;
					gap: 4px;
					overflow: auto;
				}
				.side a {
					white-space: nowrap;
					border: 1px solid var(--line);
				}
				.content {
					margin-top: 24px;
				}
				.member {
					grid-template-columns: 42px minmax(0, 1fr) auto;
				}
				.member p {
					max-width: 190px;
				}
				.member .follow {
					padding: 0 8px;
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand" href="home-c.html">睦<i>谈</i></a>
			<nav class="links"><a>首页</a><a>微博</a><a>论坛</a><a>博客</a></nav>
			<div class="actions">
				<button class="search" aria-label="搜索">搜索</button
				><select class="theme" id="theme" aria-label="主题">
					<option value="light">浅色</option>
					<option value="dark">深色</option>
					<option value="eye">护眼</option></select
				><span class="avatar">木</span>
			</div>
		</header>
		<main class="shell">
			<aside class="person">
				<div class="profile">
					<span class="big-avatar">木</span>
					<div><b>木炭</b><span>@woodcoal</span></div>
				</div>
				<nav class="side">
					<a href="profile-a.html">个人主页</a><a class="on">关注与粉丝</a><a>收藏</a
					><a href="user-center-a.html">账户设置</a>
				</nav>
			</aside>
			<section class="content">
				<h1>关注与粉丝</h1>
				<p>管理你在睦谈中关心的人，也看看谁在关注你的动态。</p>
				<nav class="tabs">
					<button class="on" data-tab="following">关注 48</button
					><button data-tab="followers">粉丝 126</button>
				</nav>
				<div class="list" id="list"></div>
				<p class="hint">列表中的按钮可切换关注状态。</p>
			</section>
		</main>
		<script>
			const data = {
				following: [
					['林冲', '社区运营与长期讨论。', '林'],
					['花荣', '前端与交互设计记录。', '花'],
					['阮小七', '夜间阅读，偶尔写下所见。', '阮']
				],
				followers: [
					['清风入梦', '关注了你的博客与论坛动态。', '清'],
					['小满', '正在参与「社区设计」话题。', '满'],
					['橘子汽水', '收藏了你的一篇文章。', '橘']
				]
			};
			const list = document.querySelector('#list');
			function render(tab) {
				list.innerHTML = data[tab]
					.map(
						(x, i) =>
							`<article class="member"><span class="photo">${x[2]}</span><div><h2>${x[0]}</h2><p>${x[1]}</p></div><button class="follow ${tab === 'following' ? 'active' : ''}">${tab === 'following' ? '已关注' : '关注'}</button></article>`
					)
					.join('');
				document.querySelectorAll('.follow').forEach(
					(b) =>
						(b.onclick = () => {
							b.classList.toggle('active');
							b.textContent = b.classList.contains('active') ? '已关注' : '关注';
						})
				);
			}
			document.querySelectorAll('[data-tab]').forEach(
				(b) =>
					(b.onclick = () => {
						document
							.querySelectorAll('[data-tab]')
							.forEach((x) => x.classList.remove('on'));
						b.classList.add('on');
						render(b.dataset.tab);
					})
			);
			render('following');
			const root = document.documentElement,
				theme = document.querySelector('#theme');
			theme.value = localStorage.getItem('mutan-theme') || 'light';
			root.dataset.theme = theme.value;
			theme.onchange = () => {
				root.dataset.theme = theme.value;
				localStorage.setItem('mutan-theme', theme.value);
			};
		</script>
	</body>
</html>
