<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 通知</title>
		<style>
			:root {
				--t: #1a1a2e;
				--m: #64748b;
				--b: #e2e8f0;
				--p: #4f46e5;
				font:
					15px -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					'Noto Sans SC',
					sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: var(--t);
			}
			a {
				text-decoration: none;
				color: inherit;
			}
			.top {
				height: 64px;
				display: flex;
				align-items: center;
				gap: 28px;
				padding: 0 24px;
				border-bottom: 1px solid var(--b);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
			}
			.brand i {
				font-style: normal;
				color: var(--p);
			}
			.links {
				flex: 1;
				display: flex;
				gap: 6px;
			}
			.links a {
				padding: 8px 10px;
				color: var(--m);
			}
			.actions {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.search {
				min-width: 190px;
				padding: 8px 12px;
				color: var(--m);
				border: 1px solid var(--b);
				border-radius: 6px;
			}
			.avatar {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--p);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.shell {
				max-width: 850px;
				margin: auto;
				padding: 34px 24px 80px;
			}
			.head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 16px;
			}
			.head h1 {
				margin: 0;
				font-size: 28px;
			}
			.head button {
				border: 0;
				background: none;
				color: var(--p);
				font-weight: 700;
			}
			.tabs {
				display: flex;
				gap: 6px;
				border-bottom: 1px solid var(--b);
			}
			.tabs a {
				padding: 10px 12px;
				color: var(--m);
			}
			.tabs .on {
				color: var(--p);
				border-bottom: 2px solid var(--p);
				font-weight: 700;
			}
			.notice {
				display: flex;
				gap: 12px;
				padding: 16px;
				border-bottom: 1px solid var(--b);
			}
			.notice.unread {
				background: #f8faff;
			}
			.face {
				width: 40px;
				height: 40px;
				flex: 0 0 40px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: #0d9488;
				color: #fff;
				font-weight: 800;
			}
			.notice p {
				margin: 0;
				line-height: 1.65;
			}
			.notice small {
				display: block;
				margin-top: 4px;
				color: var(--m);
			}
			.snippet {
				margin-top: 8px;
				padding: 8px 10px;
				color: var(--m);
				font-size: 13px;
				background: #f8fafc;
				border-left: 2px solid var(--b);
			}
			.bottom {
				display: none;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 14px;
				}
				.links {
					display: none;
				}
				.search {
					min-width: 0;
					width: 36px;
					padding: 0;
					border: 0;
					font-size: 0;
				}
				.search:before {
					content: '⌕';
					font-size: 24px;
				}
				.shell {
					padding: 22px 14px 80px;
				}
				.bottom {
					display: flex;
					position: fixed;
					bottom: 0;
					left: 0;
					right: 0;
					justify-content: space-around;
					padding: 7px;
					background: #fff;
					border-top: 1px solid var(--b);
				}
				.bottom a {
					padding: 10px;
					font-size: 12px;
				}
				.bottom a:nth-child(4) {
					color: var(--p);
					font-weight: 700;
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand">睦<i>谈</i></a>
			<nav class="links"><a>首页</a><a>微博</a><a>论坛</a><a>博客</a></nav>
			<div class="actions">
				<span class="search">搜索睦谈</span><span>◐</span><span class="avatar">木</span>
			</div>
		</header>
		<main class="shell">
			<div class="head">
				<h1>通知</h1>
				<button>全部标为已读</button>
			</div>
			<nav class="tabs"><a class="on">全部</a><a>互动</a><a>关注</a><a>系统</a></nav>
			<article class="notice unread">
				<span class="face">花</span>
				<div>
					<p><b>花荣</b> 回复了你的微博</p>
					<div class="snippet">认同。把发现放到右栏，主阅读才不会被打断。</div>
					<small>8 分钟前</small>
				</div>
			</article>
			<article class="notice unread">
				<span class="face">潮</span>
				<div>
					<p><b>潮汐</b> 在讨论 <b>如何让小社区的讨论持续发生？</b> 中提到了你</p>
					<div class="snippet">我们也遇到同样的问题，想听听你的看法。</div>
					<small>30 分钟前</small>
				</div>
			</article>
			<article class="notice">
				<span class="face">苏</span>
				<div>
					<p><b>苏晚</b> 关注了你</p>
					<small>昨天</small>
				</div>
			</article>
		</main>
		<nav class="bottom"><a>首页</a><a>搜索</a><a>发布</a><a>通知</a><a>我的</a></nav>
	</body>
</html>
