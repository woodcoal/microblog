<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 个人主页</title>
		<style>
			:root {
				--bg: #fff;
				--s: #f8fafc;
				--t: #1a1a2e;
				--m: #64748b;
				--b: #e2e8f0;
				--p: #4f46e5;
				font:
					15px -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					'Noto Sans SC',
					sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--t);
			}
			a {
				text-decoration: none;
				color: inherit;
			}
			.top {
				height: 64px;
				position: sticky;
				top: 0;
				z-index: 3;
				display: flex;
				align-items: center;
				gap: 28px;
				padding: 0 24px;
				background: #fff;
				border-bottom: 1px solid var(--b);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
			}
			.brand i {
				font-style: normal;
				color: var(--p);
			}
			.channels {
				display: flex;
				gap: 6px;
				flex: 1;
			}
			.channels a {
				padding: 8px 10px;
				color: var(--m);
			}
			.actions {
				margin-left: auto;
				display: flex;
				gap: 10px;
				align-items: center;
			}
			.search {
				min-width: 190px;
				padding: 8px 12px;
				color: var(--m);
				border: 1px solid var(--b);
				border-radius: 6px;
			}
			.icon {
				width: 36px;
				height: 36px;
				display: grid;
				place-items: center;
				color: var(--m);
			}
			.avatar {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--p);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.shell {
				max-width: 1120px;
				margin: auto;
				padding: 32px 24px 80px;
				display: grid;
				grid-template-columns: minmax(0, 720px) 260px;
				gap: 32px;
				justify-content: center;
			}
			.profile {
				border: 1px solid var(--b);
				border-radius: 12px;
				overflow: hidden;
			}
			.cover {
				height: 156px;
				background: #e8edff;
				border-bottom: 1px solid #d8ddf8;
			}
			.info {
				position: relative;
				padding: 0 20px 20px;
			}
			.info > .avatar {
				width: 88px;
				height: 88px;
				margin-top: -44px;
				border: 4px solid #fff;
				font-size: 31px;
			}
			.row {
				display: flex;
				align-items: start;
				justify-content: space-between;
				margin-top: 12px;
			}
			.row h1 {
				margin: 0;
				font-size: 25px;
			}
			.handle,
			.muted {
				color: var(--m);
				font-size: 13px;
			}
			.bio {
				margin: 12px 0;
				line-height: 1.65;
			}
			.stats {
				display: flex;
				gap: 22px;
			}
			.stats b {
				display: block;
				font-size: 17px;
			}
			.stats small {
				color: var(--m);
				font-size: 12px;
			}
			.btn {
				padding: 9px 13px;
				border: 1px solid var(--b);
				border-radius: 6px;
				background: #fff;
				color: var(--t);
				font-weight: 700;
			}
			.tabs {
				display: flex;
				gap: 4px;
				margin: 24px 0 12px;
				border-bottom: 1px solid var(--b);
			}
			.tabs a {
				padding: 10px 12px;
				color: var(--m);
			}
			.tabs .on {
				color: var(--p);
				border-bottom: 2px solid var(--p);
				font-weight: 700;
			}
			.post {
				border: 1px solid var(--b);
				border-radius: 10px;
				padding: 16px;
				margin-bottom: 12px;
			}
			.post-head {
				display: flex;
				gap: 10px;
				align-items: center;
			}
			.post p {
				line-height: 1.65;
				margin: 11px 0;
			}
			.meta {
				font-size: 13px;
				color: var(--m);
			}
			.rail .card {
				border: 1px solid var(--b);
				border-radius: 10px;
				padding: 16px;
				margin-bottom: 12px;
			}
			.rail h2 {
				margin: 0 0 10px;
				font-size: 14px;
			}
			.rail a {
				display: block;
				padding: 10px 0;
				border-top: 1px solid var(--b);
				font-size: 14px;
			}
			.rail a:first-of-type {
				border: 0;
			}
			.bottom {
				display: none;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 14px;
					gap: 12px;
				}
				.channels {
					display: none;
				}
				.search {
					min-width: 0;
					width: 36px;
					padding: 0;
					border: 0;
					font-size: 0;
				}
				.search:before {
					content: '⌕';
					font-size: 24px;
				}
				.icon:nth-of-type(2) {
					display: none;
				}
				.shell {
					display: block;
					padding: 20px 14px 80px;
				}
				.rail {
					display: none;
				}
				.cover {
					height: 120px;
				}
				.bottom {
					display: flex;
					position: fixed;
					z-index: 4;
					bottom: 0;
					left: 0;
					right: 0;
					justify-content: space-around;
					padding: 7px;
					background: #fff;
					border-top: 1px solid var(--b);
				}
				.bottom a {
					padding: 10px;
					font-size: 12px;
				}
				.bottom a:last-child {
					color: var(--p);
					font-weight: 700;
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand">睦<i>谈</i></a>
			<nav class="channels"><a>首页</a><a>微博</a><a>论坛</a><a>博客</a></nav>
			<div class="actions">
				<span class="search">搜索睦谈</span><span class="icon">◐</span
				><span class="icon">♢</span><span class="avatar">木</span>
			</div>
		</header>
		<main class="shell">
			<section>
				<article class="profile">
					<div class="cover"></div>
					<div class="info">
						<span class="avatar">林</span>
						<div class="row">
							<div>
								<h1>林冲</h1>
								<span class="handle">@linchong</span>
							</div>
							<button class="btn">编辑资料</button>
						</div>
						<p class="bio">
							关注产品、写作与社区体验。把正在思考的事情说出来，也把值得留下的内容写完整。
						</p>
						<div class="stats">
							<span><b>128</b><small>关注</small></span
							><span><b>846</b><small>粉丝</small></span
							><span><b>76</b><small>内容</small></span>
						</div>
					</div>
				</article>
				<nav class="tabs"><a class="on">动态</a><a>文章</a><a>讨论</a><a>收藏</a></nav>
				<article class="post">
					<div class="post-head">
						<span class="avatar">林</span>
						<div>
							<b>林冲</b>
							<div class="meta">12 分钟前 · 微博</div>
						</div>
					</div>
					<p>
						真正好用的信息流不必填满屏幕。阅读主列保持克制，辅助栏只在需要发现更多话题时出现。
					</p>
					<span class="meta">回复 12　转发 8　喜欢 46</span>
				</article>
				<article class="post">
					<div class="post-head">
						<span class="avatar">林</span>
						<div>
							<b>林冲</b>
							<div class="meta">昨天 · 博客</div>
						</div>
					</div>
					<p><b>长文阅读的最佳行宽，不只是一个数字</b></p>
					<span class="meta">8 分钟阅读　·　12 条讨论</span>
				</article>
			</section>
			<aside class="rail">
				<div class="card">
					<h2>个人菜单</h2>
					<a>我的主页</a><a>收藏内容</a><a>关注与粉丝</a><a>账户设置</a>
				</div>
				<div class="card">
					<h2>最近关注</h2>
					<a>花荣</a><a>苏晚</a><a>潮汐</a>
				</div>
			</aside>
		</main>
		<nav class="bottom"><a>首页</a><a>频道</a><a>发布</a><a>通知</a><a>我的</a></nav>
	</body>
</html>
