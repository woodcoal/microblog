<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 注册</title>
		<style>
			:root {
				--bg: #fff;
				--surface: #f8fafc;
				--card: #fff;
				--text: #1a1a2e;
				--muted: #64748b;
				--line: #e2e8f0;
				--primary: #4f46e5;
				--soft: #eef2ff;
				--danger: #b42318;
				--ok: #15803d;
				--font:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC',
					'Microsoft YaHei', sans-serif;
			}
			[data-theme='dark'] {
				--bg: #0f172a;
				--surface: #172033;
				--card: #1e293b;
				--text: #e2e8f0;
				--muted: #94a3b8;
				--line: #334155;
				--primary: #818cf8;
				--soft: #252b52;
				--danger: #fda4af;
				--ok: #86efac;
			}
			[data-theme='eye'] {
				--bg: #f5f0e8;
				--surface: #ede8dc;
				--card: #faf7f0;
				--text: #3d3929;
				--muted: #8a8474;
				--line: #d4cfc4;
				--primary: #6b8e4e;
				--soft: #e2ead8;
				--danger: #b45309;
				--ok: #4d7c0f;
			}
			* {
				box-sizing: border-box;
			}
			body {
				min-height: 100vh;
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.55 var(--font);
			}
			a {
				color: inherit;
				text-decoration: none;
			}
			button,
			input,
			select {
				font: inherit;
			}
			.top {
				height: 64px;
				display: flex;
				align-items: center;
				padding: 0 clamp(18px, 4vw, 56px);
				border-bottom: 1px solid var(--line);
				background: var(--card);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
				letter-spacing: -0.05em;
			}
			.brand i {
				color: var(--primary);
				font-style: normal;
			}
			.top-tools {
				margin-left: auto;
			}
			.theme {
				min-height: 36px;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 0 9px;
				background: var(--card);
				color: var(--text);
			}
			.page {
				width: min(100%, 1180px);
				min-height: calc(100vh - 64px);
				margin: auto;
				padding: clamp(34px, 7vh, 76px) 24px 52px;
				display: grid;
				grid-template-columns: minmax(290px, 405px) minmax(280px, 390px);
				justify-content: space-between;
				gap: clamp(40px, 10vw, 160px);
				align-items: start;
			}
			.intro {
				padding-top: 24px;
			}
			.kicker {
				color: var(--primary);
				font-size: 13px;
				font-weight: 800;
				letter-spacing: 0.08em;
			}
			h1 {
				max-width: 480px;
				margin: 12px 0 16px;
				font-size: clamp(34px, 4vw, 52px);
				line-height: 1.08;
				letter-spacing: -0.06em;
				text-wrap: pretty;
			}
			.intro p {
				max-width: 390px;
				margin: 0;
				color: var(--muted);
				font-size: 17px;
			}
			.steps {
				margin: 32px 0 0;
				padding: 0;
				list-style: none;
				counter-reset: step;
			}
			.steps li {
				display: grid;
				grid-template-columns: 30px 1fr;
				gap: 10px;
				margin: 15px 0;
				color: var(--muted);
			}
			.steps li:before {
				content: counter(step);
				counter-increment: step;
				width: 24px;
				height: 24px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--soft);
				color: var(--primary);
				font-size: 12px;
				font-weight: 800;
			}
			.panel {
				padding: 30px;
				border: 1px solid var(--line);
				border-radius: 10px;
				background: var(--card);
				box-shadow: 0 18px 38px rgba(15, 23, 42, 0.06);
			}
			.panel h2 {
				margin: 0;
				font-size: 24px;
				letter-spacing: -0.035em;
			}
			.panel > p {
				margin: 5px 0 22px;
				color: var(--muted);
			}
			label {
				display: block;
				margin: 14px 0 6px;
				font-size: 13px;
				font-weight: 750;
			}
			input {
				width: 100%;
				min-height: 44px;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 0 12px;
				background: var(--bg);
				color: var(--text);
				outline: 0;
			}
			input:focus {
				border-color: var(--primary);
				box-shadow: 0 0 0 3px var(--soft);
			}
			.password-note {
				margin: 6px 0 0;
				color: var(--muted);
				font-size: 12px;
			}
			.agreement {
				display: flex;
				align-items: flex-start;
				gap: 8px;
				margin: 16px 0 20px;
				color: var(--muted);
				font-size: 13px;
			}
			.agreement input {
				width: 16px;
				min-height: 16px;
				margin: 3px 0 0;
				accent-color: var(--primary);
			}
			.agreement a {
				color: var(--primary);
				font-weight: 700;
			}
			.submit {
				width: 100%;
				min-height: 44px;
				border: 1px solid var(--primary);
				border-radius: 6px;
				background: var(--primary);
				color: #fff;
				font-weight: 800;
				cursor: pointer;
			}
			.submit:hover {
				filter: brightness(0.95);
			}
			.feedback {
				min-height: 20px;
				margin: 12px 0 0;
				color: var(--danger);
				font-size: 13px;
			}
			.feedback.ok {
				color: var(--ok);
			}
			.foot {
				margin: 22px 0 0;
				padding-top: 20px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				text-align: center;
			}
			.foot a {
				color: var(--primary);
				font-weight: 750;
			}
			button:focus-visible,
			a:focus-visible,
			input:focus-visible,
			select:focus-visible {
				outline: 3px solid var(--primary);
				outline-offset: 2px;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 16px;
				}
				.page {
					min-height: calc(100vh - 56px);
					display: block;
					padding: 34px 16px 44px;
				}
				.intro {
					padding: 0;
					margin-bottom: 32px;
				}
				.intro p {
					font-size: 16px;
				}
				h1 {
					font-size: 38px;
				}
				.steps {
					display: none;
				}
				.panel {
					padding: 24px 20px;
					box-shadow: none;
				}
			}
			@media (prefers-reduced-motion: no-preference) {
				.panel {
					animation: arrive 0.35s ease-out both;
				}
				@keyframes arrive {
					from {
						opacity: 0;
						transform: translateY(8px);
					}
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand" href="home-c.html">睦<i>谈</i></a>
			<div class="top-tools">
				<select class="theme" id="theme" aria-label="切换主题">
					<option value="light">浅色</option>
					<option value="dark">深色</option>
					<option value="eye">护眼</option>
				</select>
			</div>
		</header>
		<main class="page">
			<section class="intro" aria-labelledby="join">
				<div class="kicker">开始你的参与</div>
				<h1 id="join">在这里，留下一点有用的声音。</h1>
				<p>创建账号后，你可以发布、参与讨论，也可以安静地关注感兴趣的人和话题。</p>
				<ol class="steps">
					<li><span>用邮箱建立可找回的账号。</span></li>
					<li><span>设置昵称，之后随时可在用户中心修改。</span></li>
					<li><span>选择感兴趣的频道，开始阅读与交流。</span></li>
				</ol>
			</section>
			<section class="panel" aria-labelledby="register-title">
				<h2 id="register-title">创建账号</h2>
				<p>只需几步，即可加入睦谈。</p>
				<form id="register-form" novalidate>
					<label for="email">邮箱</label
					><input
						id="email"
						type="email"
						autocomplete="email"
						placeholder="name@example.com"
					/><label for="name">昵称</label
					><input id="name" autocomplete="nickname" placeholder="例如：晨间读者" /><label
						for="password"
						>设置密码</label
					><input
						id="password"
						type="password"
						autocomplete="new-password"
						placeholder="至少 8 个字符"
					/>
					<p class="password-note">建议包含字母、数字或符号。</p>
					<label class="agreement"
						><input id="agree" type="checkbox" /><span
							>我已阅读并同意<a href="#terms">服务条款</a>与<a href="#privacy"
								>隐私说明</a
							>。</span
						></label
					><button class="submit" type="submit">创建账号</button>
					<p class="feedback" id="feedback" role="status" aria-live="polite"></p>
				</form>
				<p class="foot">已经有账号？ <a href="login-a.html">去登录</a></p>
			</section>
		</main>
		<script>
			const root = document.documentElement,
				theme = document.querySelector('#theme'),
				form = document.querySelector('#register-form'),
				emailInput = document.querySelector('#email'),
				nameInput = document.querySelector('#name'),
				passwordInput = document.querySelector('#password'),
				agreeInput = document.querySelector('#agree'),
				feedback = document.querySelector('#feedback');
			theme.value = localStorage.getItem('mutan-theme') || 'light';
			root.dataset.theme = theme.value;
			theme.addEventListener('change', () => {
				root.dataset.theme = theme.value;
				localStorage.setItem('mutan-theme', theme.value);
			});
			form.addEventListener('submit', (e) => {
				e.preventDefault();
				const valid =
					emailInput.value.trim() &&
					nameInput.value.trim() &&
					passwordInput.value.length >= 8 &&
					agreeInput.checked;
				feedback.className = 'feedback' + (valid ? ' ok' : '');
				feedback.textContent = valid
					? '这是交互原型：账号信息已准备就绪。'
					: '请填写邮箱、昵称和至少 8 位密码，并同意服务条款。';
			});
		</script>
	</body>
</html>
