<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>睦谈 · 用户中心</title>
		<style>
			:root {
				--bg: #fff;
				--s: #f8fafc;
				--t: #1a1a2e;
				--m: #64748b;
				--b: #e2e8f0;
				--p: #4f46e5;
				font:
					15px -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					'Noto Sans SC',
					sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: var(--t);
			}
			a {
				text-decoration: none;
				color: inherit;
			}
			.top {
				height: 64px;
				position: sticky;
				top: 0;
				z-index: 3;
				display: flex;
				align-items: center;
				gap: 28px;
				padding: 0 24px;
				background: #fff;
				border-bottom: 1px solid var(--b);
			}
			.brand {
				font-size: 20px;
				font-weight: 800;
			}
			.brand i {
				font-style: normal;
				color: var(--p);
			}
			.channels {
				display: flex;
				gap: 6px;
				flex: 1;
			}
			.channels a {
				padding: 8px 10px;
				color: var(--m);
			}
			.actions {
				margin-left: auto;
				display: flex;
				gap: 10px;
				align-items: center;
			}
			.search {
				min-width: 190px;
				padding: 8px 12px;
				color: var(--m);
				border: 1px solid var(--b);
				border-radius: 6px;
			}
			.icon {
				width: 36px;
				height: 36px;
				display: grid;
				place-items: center;
				color: var(--m);
			}
			.avatar {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: 50%;
				background: var(--p);
				color: #fff;
				font-size: 12px;
				font-weight: 800;
			}
			.shell {
				max-width: 1040px;
				margin: auto;
				padding: 32px 24px 80px;
				display: grid;
				grid-template-columns: 200px minmax(0, 680px);
				gap: 36px;
				justify-content: center;
			}
			.side h2 {
				margin: 0 10px 8px;
				color: var(--m);
				font-size: 12px;
				text-transform: uppercase;
			}
			.side a {
				display: block;
				padding: 10px;
				border-radius: 6px;
				color: var(--m);
			}
			.side a.on {
				background: #eef2ff;
				color: var(--p);
				font-weight: 700;
			}
			.head {
				margin-bottom: 20px;
			}
			.head h1 {
				margin: 0;
				font-size: 28px;
			}
			.head p {
				margin: 4px 0;
				color: var(--m);
			}
			.panel {
				border: 1px solid var(--b);
				border-radius: 10px;
				padding: 20px;
				margin-bottom: 14px;
			}
			.panel h2 {
				margin: 0 0 5px;
				font-size: 18px;
			}
			.hint {
				margin: 0 0 18px;
				color: var(--m);
				font-size: 13px;
			}
			.form {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 14px;
			}
			.form label {
				display: block;
				font-size: 13px;
				font-weight: 700;
			}
			.form input,
			.form textarea {
				width: 100%;
				margin-top: 6px;
				padding: 9px 10px;
				border: 1px solid var(--b);
				border-radius: 6px;
				font: inherit;
				color: var(--t);
			}
			.form textarea {
				height: 76px;
				resize: vertical;
			}
			.wide {
				grid-column: 1/-1;
			}
			.save {
				margin-top: 18px;
				padding: 10px 15px;
				border: 0;
				border-radius: 6px;
				background: var(--p);
				color: #fff;
				font-weight: 700;
			}
			.switch {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 14px 0;
				border-top: 1px solid var(--b);
			}
			.switch:first-of-type {
				border: 0;
			}
			.switch p {
				margin: 2px 0 0;
				color: var(--m);
				font-size: 13px;
			}
			.toggle {
				width: 42px;
				height: 24px;
				padding: 3px;
				border-radius: 99px;
				background: var(--p);
			}
			.toggle:after {
				content: '';
				display: block;
				width: 18px;
				height: 18px;
				margin-left: auto;
				border-radius: 50%;
				background: #fff;
			}
			.bottom {
				display: none;
			}
			@media (max-width: 767px) {
				.top {
					height: 56px;
					padding: 0 14px;
					gap: 12px;
				}
				.channels {
					display: none;
				}
				.search {
					min-width: 0;
					width: 36px;
					padding: 0;
					border: 0;
					font-size: 0;
				}
				.search:before {
					content: '⌕';
					font-size: 24px;
				}
				.icon:nth-of-type(2) {
					display: none;
				}
				.shell {
					display: block;
					padding: 20px 14px 80px;
				}
				.side {
					display: flex;
					gap: 4px;
					overflow: auto;
					margin-bottom: 20px;
				}
				.side h2 {
					display: none;
				}
				.side a {
					white-space: nowrap;
					border: 1px solid var(--b);
				}
				.head h1 {
					font-size: 24px;
				}
				.form {
					grid-template-columns: 1fr;
				}
				.wide {
					grid-column: auto;
				}
				.bottom {
					display: flex;
					position: fixed;
					z-index: 4;
					bottom: 0;
					left: 0;
					right: 0;
					justify-content: space-around;
					padding: 7px;
					background: #fff;
					border-top: 1px solid var(--b);
				}
				.bottom a {
					padding: 10px;
					font-size: 12px;
				}
				.bottom a:last-child {
					color: var(--p);
					font-weight: 700;
				}
			}
		</style>
	</head>
	<body>
		<header class="top">
			<a class="brand">睦<i>谈</i></a>
			<nav class="channels"><a>首页</a><a>微博</a><a>论坛</a><a>博客</a></nav>
			<div class="actions">
				<span class="search">搜索睦谈</span><span class="icon">◐</span
				><span class="icon">♢</span><span class="avatar">木</span>
			</div>
		</header>
		<main class="shell">
			<nav class="side">
				<h2>用户中心</h2>
				<a class="on">账户设置</a><a>通知偏好</a><a>隐私与安全</a><a>内容与收藏</a
				><a>账号管理</a>
			</nav>
			<section>
				<div class="head">
					<h1>账户设置</h1>
					<p>管理你的公开资料与账号偏好。</p>
				</div>
				<article class="panel">
					<h2>公开资料</h2>
					<p class="hint">这些信息将展示在个人主页和内容作者信息中。</p>
					<div class="form">
						<label>显示名称<input value="林冲" /></label
						><label>账号 ID<input value="@linchong" /></label
						><label class="wide"
							>个人简介<textarea>关注产品、写作与社区体验。</textarea>
						</label>
					</div>
					<button class="save">保存资料</button>
				</article>
				<article class="panel">
					<h2>通知偏好</h2>
					<div class="switch">
						<div>
							<b>互动通知</b>
							<p>回复、喜欢、转发和关注时通知我。</p>
						</div>
						<span class="toggle"></span>
					</div>
					<div class="switch">
						<div>
							<b>内容推荐</b>
							<p>接收值得阅读的内容与讨论提醒。</p>
						</div>
						<span class="toggle"></span>
					</div>
					<div class="switch">
						<div>
							<b>邮件摘要</b>
							<p>每周发送一次未读内容摘要。</p>
						</div>
						<span class="toggle"></span>
					</div>
				</article>
			</section>
		</main>
		<nav class="bottom"><a>首页</a><a>频道</a><a>发布</a><a>通知</a><a>我的</a></nav>
	</body>
</html>
