<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睦谈 · 用户中心 UX 原型</title><link rel="stylesheet" href="prototype.css"></head><body><header class="topbar"><div class="topbar__in"><a class="brand" href="index.html">睦<b>谈</b></a><nav class="channels"><a href="index.html">首页</a><a href="weibo.html">微博</a><a href="forum.html">论坛</a><a href="blog.html">博客</a></nav><div class="top-actions"><button class="theme" data-theme-toggle aria-label="切换深浅色">◐</button><span class="avatar mini">林</span></div></div></header><main class="shell"><header class="page-head"><div><div class="eyebrow">配置 · 个人账户</div><h1>用户中心</h1><p>将账户、个人资料、外观和开发者能力按任务分组；保存操作始终清晰可见。</p></div></header><div class="setting-layout"><aside class="settings-nav" aria-label="设置分区"><button class="active" data-tab>个人资料</button><button data-tab>账户与安全</button><button data-tab>外观偏好</button><button data-tab>通知设置</button><button data-tab>API Token</button><button data-tab>Webhook</button></aside><section class="card card-pad"><div class="section-title"><span>个人资料</span><span class="handle">公开信息</span></div><div class="form-row"><div><label for="name">显示名称</label><small>会显示在帖子和评论旁。</small></div><input id="name" class="input" value="林一"></div><div class="form-row"><div><label for="bio">个人简介</label><small>最多 160 个字符。</small></div><textarea id="bio" class="input" rows="4">记录产品、写作与社区协作中的小发现。</textarea></div><div class="form-row"><div><label>头像</label><small>JPG、PNG，最大 2 MB。</small></div><div style="display:flex;gap:12px;align-items:center"><span class="avatar">林</span><button class="btn" data-toast="已打开头像选择器">更换头像</button></div></div><div class="settings-foot"><span class="handle">上次保存于今天 10:24</span><button class="btn primary" data-toast="个人资料已保存">保存更改</button></div></section></div></main><script src="prototype.js"></script></body></html>
