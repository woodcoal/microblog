<main id="main" class="shell">
<div class="setting-layout">

  <aside class="sidebar">
    <a class="side-link active" href="user-center.html"><span>⚙️</span>账户设置</a>
    <a class="side-link" href="#"><span>🔔</span>通知偏好</a>

  </aside>

  <section>
    <h1 style="margin:0 0 4px;font-size:24px">账户设置</h1>
    <p class="handle" style="margin:0 0 20px">管理你的个人资料与账户安全</p>

    <div class="uc-grid" style="margin-bottom:20px">
      <article class="card card-pad">
        <div class="eyebrow">资料</div>
        <div class="form-field"><label>显示名称</label><input value="林冲"></div>
        <div class="form-field"><label>用户名</label><input value="linchong" disabled></div>
        <div class="form-field"><label>简介</label><textarea rows="2">关注产品设计、工程化与团队协作。</textarea></div>
        <button class="btn primary" data-toast="资料已保存">保存</button>
      </article>

      <article class="card card-pad">
        <div class="eyebrow">安全</div>
        <div class="form-field"><label>当前密码</label><input type="password" placeholder="••••••••"></div>
        <div class="form-field"><label>新密码</label><input type="password"></div>
        <div class="form-field"><label>确认新密码</label><input type="password"></div>
        <button class="btn primary" data-toast="密码已更新">修改密码</button>
      </article>

      <article class="card card-pad">
        <div class="eyebrow">偏好</div>
        <div class="form-field"><label>默认频道</label>
          <select><option>微博</option><option>论坛</option><option>博客</option></select>
        </div>
        <div class="form-field"><label>语言</label>
          <select><option>简体中文</option><option>English</option></select>
        </div>
        <button class="btn primary" data-toast="偏好已保存">保存</button>
      </article>
    </div>
  </section>

</div>
