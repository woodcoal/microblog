<!doctype html>
<html lang="zh-CN">
	<meta charset="utf-8" /><meta
		name="viewport"
		content="width=device-width,initial-scale=1"
	/><title>睦谈 · 微博详情</title
	><style>
		:root {
			font:
				15px -apple-system,
				BlinkMacSystemFont,
				'Segoe UI',
				'Noto Sans SC',
				sans-serif;
			--t: #1a1a2e;
			--m: #64748b;
			--b: #e2e8f0;
			--p: #4f46e5;
			--s: #f8fafc;
		}
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			color: var(--t);
		}
		.top {
			height: 64px;
			border-bottom: 1px solid var(--b);
			display: flex;
			align-items: center;
			gap: 26px;
			/* 账号与主题操作始终贴近浏览器视口右侧。 */
			padding: 0 24px;
			position: sticky;
			top: 0;
			background: #fff;
			z-index: 2;
		}
		.brand {
			font-size: 20px;
			font-weight: 800;
		}
		.brand i {
			color: var(--p);
			font-style: normal;
		}
		.links {
			display: flex;
			gap: 10px;
			flex: 1;
		}
		.links b {
			color: var(--p);
		}
		.search {
			border: 1px solid var(--b);
			padding: 8px 12px;
			border-radius: 6px;
			color: var(--m);
		}
		.top-actions {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-left: auto;
		}
		.ava {
			display: grid;
			place-items: center;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background: var(--p);
			color: #fff;
			font-size: 12px;
			font-weight: bold;
		}
		.layout {
			max-width: 1100px;
			margin: auto;
			padding: 32px 24px 80px;
			display: grid;
			grid-template-columns: minmax(0, 720px) 260px;
			gap: 32px;
		}
		.crumb {
			color: var(--m);
			font-size: 13px;
			margin-bottom: 16px;
		}
		.post,
		.comment,
		.aside {
			border: 1px solid var(--b);
			border-radius: 10px;
			padding: 18px;
			margin-bottom: 12px;
		}
		.author {
			display: flex;
			gap: 10px;
			align-items: center;
		}
		.author small,
		.meta {
			display: block;
			color: var(--m);
			font-size: 13px;
		}
		.copy {
			font-size: 18px;
			line-height: 1.75;
			margin: 18px 0;
		}
		.actions {
			display: flex;
			gap: 24px;
			color: var(--m);
			border-top: 1px solid var(--b);
			padding-top: 14px;
		}
		.comments h2 {
			font-size: 18px;
			margin: 28px 0 12px;
		}
		.comment {
			display: flex;
			gap: 10px;
		}
		.comment p {
			margin: 7px 0;
		}
		.compose {
			padding: 12px;
			border: 1px solid var(--b);
			border-radius: 8px;
			color: var(--m);
		}
		.aside h2 {
			font-size: 13px;
			margin: 0 0 10px;
		}
		.aside p {
			padding: 10px 0;
			border-top: 1px solid var(--b);
			margin: 0;
		}
		.bottom {
			display: none;
		}
		@media (max-width: 767px) {
			.top {
				height: 56px;
				padding: 0 14px;
			}
			.links {
				display: none;
			}
			.search {
				font-size: 0;
				border: 0;
				padding: 0;
			}
			.search:before {
				content: '⌕';
				font-size: 24px;
			}
			.layout {
				display: block;
				padding: 20px 14px 80px;
			}
			.aside {
				display: none;
			}
			.copy {
				font-size: 17px;
			}
			.bottom {
				position: fixed;
				display: flex;
				bottom: 0;
				left: 0;
				right: 0;
				justify-content: space-around;
				background: #fff;
				border-top: 1px solid var(--b);
				padding: 8px;
			}
			.bottom a {
				padding: 9px;
				font-size: 12px;
			}
			.bottom a:last-child {
				color: var(--p);
				font-weight: bold;
			}
		}
	</style>
	<body>
		<header class="top">
			<div class="brand">睦<i>谈</i></div>
			<nav class="links"><span>首页</span><b>微博</b><span>论坛</span><span>博客</span></nav>
			<div class="top-actions" aria-label="全局操作">
				<span class="search">搜索睦谈</span><span>◐</span><span>♢</span
				><span class="ava">木</span>
			</div>
		</header>
		<main class="layout">
			<section>
				<div class="crumb">微博 / 讨论</div>
				<article class="post">
					<div class="author">
						<span class="ava">林</span>
						<div><b>林冲</b><small>@linchong · 12 分钟前</small></div>
					</div>
					<p class="copy">
						真正好用的信息流不必填满屏幕。阅读主列保持克制，辅助栏只在需要发现更多话题时出现。
					</p>
					<span class="meta">公开 · 来自 Web</span>
					<div class="actions">回复 12　转发 8　喜欢 46　收藏</div>
				</article>
				<section class="comments">
					<h2>12 条回复</h2>
					<div class="compose">写下你的回复…</div>
					<article class="comment">
						<span class="ava">花</span>
						<div>
							<b>花荣</b><span class="meta">8 分钟前</span>
							<p>认同。把发现放到右栏，主阅读才不会被打断。</p>
							<span class="meta">回复 · 喜欢 3</span>
						</div>
					</article>
					<article class="comment">
						<span class="ava">吴</span>
						<div>
							<b>吴用</b><span class="meta">刚刚</span>
							<p>平板端则应该优先保留主列。</p>
							<span class="meta">回复 · 喜欢</span>
						</div>
					</article>
				</section>
			</section>
			<aside>
				<div class="aside">
					<h2>关于作者</h2>
					<p><b>林冲</b><br />关注产品与社区体验。</p>
				</div>
				<div class="aside">
					<h2>相关推荐</h2>
					<p>长文阅读的最佳行宽</p>
					<p>如何设计一套内容优先的壳</p>
				</div>
			</aside>
		</main>
		<nav class="bottom"><a>首页</a><a>频道</a><a>发布</a><a>通知</a><a>我的</a></nav>
	</body>
</html>
