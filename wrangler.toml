# Cloudflare Pages 部署配置
# 项目名称
name = "mutan"
# 兼容性日期
compatibility_date = "2026-06-04"
# 构建输出目录
pages_build_output_dir = "./dist"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "mutan-db"
database_id = "YOUR_DATABASE_ID"

# R2 存储绑定
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mutan-storage"

# 环境变量
[vars]
SITE_TITLE = "睦谈"
SITE_DESCRIPTION = "世间纷纷扰扰，此处和睦相谈"
ALLOW_REGISTRATION = "true"
MAX_GLOBAL_PINNED_POSTS = "3"
MAX_USER_PINNED_POSTS = "1"
